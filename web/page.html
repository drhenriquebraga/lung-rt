<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@TITLE@</title>
<link rel="stylesheet" href="/lung-assets/vendor/dropdown-morph/style.css"><link rel="stylesheet" href="/lung-assets/vendor/dropdown-morph/tokens.css"><link rel="stylesheet" href="/lung-assets/lung.css"><link rel="stylesheet" href="/lung-assets/notification.css"></head>
<body data-lung-mode="@MODE@"><main class="lung-shell">@HEADER@
<div class="lung-top"><span class="lung-note" data-lung-key="warning">Pré-laudo experimental — exige revisão médica.</span>
<div class="lung-notifications"><div id="lung-morph" class="t-morph" data-open="false"><button id="lung-bell" class="nb-bell t-morph-plus" type="button" aria-expanded="false" aria-controls="lung-notifications" data-lung-title="pending"><span class="nb-ring"><svg class="hi" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M9 21h6"/></svg></span><span class="t-badge" data-open="false" aria-hidden="true"><span class="t-badge-dot" id="lung-count">0</span></span></button>
<div id="lung-notifications" class="lung-dropdown t-morph-menu" inert aria-hidden="true"><strong data-lung-key="pending"></strong><button id="lung-close-notifications" type="button" class="ui-bt" data-lung-key="cancel"></button><div id="lung-pending"></div></div></div></div></div>
<section class="lung-step"><h2><span>1</span> <span data-lung-key="select"></span></h2><button id="lung-select" class="ui-bt" type="button" data-lung-key="select"></button><span id="lung-selection"></span></section>
<div class="lung-workspace"><section class="lung-mpr"><h2>MPR</h2><div class="lung-planes"><figure><canvas id="lung-axial" width="512" height="512" aria-label="Axial" data-lung-title="axial"></canvas><input id="lung-z" type="range" min="0" max="0" value="0" aria-label="Axial" data-lung-title="axial"></figure><figure><canvas id="lung-coronal" width="512" height="512" aria-label="Coronal" data-lung-title="coronal"></canvas><input id="lung-y" type="range" min="0" max="0" value="0" aria-label="Coronal" data-lung-title="coronal"></figure><figure><canvas id="lung-sagittal" width="512" height="512" aria-label="Sagittal" data-lung-title="sagittal"></canvas><input id="lung-x" type="range" min="0" max="0" value="0" aria-label="Sagittal" data-lung-title="sagittal"></figure></div></section>
<section class="lung-output"><h2><span>2</span> <span data-lung-key="processing"></span></h2><label id="lung-report-option"><input id="lung-generate" type="checkbox"> <span data-lung-key="generate_optional"></span></label>
<div class="lung-actions"><button id="lung-start" class="ui-bt pri" type="button" disabled data-lung-key="start"></button><button id="lung-stop" class="ui-bt" type="button" disabled data-lung-key="cancel"></button></div>
<div id="lung-status" role="status" aria-live="polite"></div><progress id="lung-progress" hidden></progress><div id="lung-error" role="alert"></div>
<pre id="lung-text" class="lung-report-text"></pre><div id="lung-reports"></div></section></div>
<section id="lung-cases-section" class="lung-step"><h2><span>3</span> <span data-lung-key="review"></span></h2><div id="lung-cases"></div></section>
<details class="lung-step" id="config"><summary data-lung-key="local_data"></summary><p data-lung-key="sync_help"></p><label><span data-lung-key="folder"></span><input id="lung-data-folder" type="text" autocomplete="off"></label><div class="lung-actions"><button id="lung-backup" class="ui-bt" data-lung-key="backup"></button><button id="lung-sync" class="ui-bt" data-lung-key="sync"></button></div><output id="lung-data-status"></output></details>
<footer data-lung-key="footer"></footer></main>@PICKER@<script type="module" src="/lung-assets/lung.js"></script></body></html>
